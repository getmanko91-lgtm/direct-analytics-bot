name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          VK_ADS_AGENCY_ID: ${{ secrets.VK_ADS_AGENCY_ID }}
          VK_ADS_CLIENT_ID: ${{ secrets.VK_ADS_CLIENT_ID }}
          VK_ADS_CLIENT_SECRET: ${{ secrets.VK_ADS_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: VK_ADS_AGENCY_ID,VK_ADS_CLIENT_ID,VK_ADS_CLIENT_SECRET
          script_stop: true
          script: |
            bash /opt/direct-analytics-bot/scripts/deploy.sh
