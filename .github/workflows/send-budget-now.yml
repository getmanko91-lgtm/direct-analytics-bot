name: Send budget warning now

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send one message per project
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            docker exec -i direct-analytics-bot python - <<'PY'
            import json
            from src.config import load_settings
            from src.db.database import SessionLocal
            from src.services.message_delivery import deliver_report_message

            messages = json.loads('''["Гринпарк г. Феодосия - специалист проекта (Лариса)\n\nсумма бюджетов 15 050,00 ₽ при недельном откруте 13 750,00 ₽\n\n(4 запущенные кампании)\n\nНедельный открут - 15 050,00 ₽ (запланировано: 13 750,00 ₽)\nМесячный открут - 60 200,00 ₽ (запланировано: 55 000,00 ₽)", "СушиСЕЛЛ г. Гатчина - специалист проекта (Ксюша)\n\nсумма бюджетов 12 000,00 ₽ при недельном откруте 5 000,00 ₽\n\n(1 запущенная кампания)\n\nНедельный открут - 12 000,00 ₽ (запланировано: 5 000,00 ₽)\nМесячный открут - 48 000,00 ₽ (запланировано: 20 000,00 ₽)", "СушиСЕЛЛ г. Ефремов - специалист проекта (Ксюша)\n\nсумма бюджетов 27 700,00 ₽ при недельном откруте 6 250,00 ₽\n\n(4 запущенные кампании)\n\nНедельный открут - 27 700,00 ₽ (запланировано: 6 250,00 ₽)\nМесячный открут - 110 800,00 ₽ (запланировано: 25 000,00 ₽)", "СушиСЕЛЛ г. Ишим - специалист проекта (Ксюша)\n\nсумма бюджетов 61 500,00 ₽ при недельном откруте 9 150,00 ₽\n\n(5 запущенных кампаний)\n\nНедельный открут - 61 500,00 ₽ (запланировано: 9 150,00 ₽)\nМесячный открут - 246 000,00 ₽ (запланировано: 36 600,00 ₽)", "СушиСЕЛЛ г. Кингисепп - специалист проекта (Ксюша)\n\nсумма бюджетов 22 000,00 ₽ при недельном откруте 9 150,00 ₽\n\n(2 запущенные кампании)\n\nНедельный открут - 22 000,00 ₽ (запланировано: 9 150,00 ₽)\nМесячный открут - 88 000,00 ₽ (запланировано: 36 600,00 ₽)", "СушиСЕЛЛ г. Киселёвск - специалист проекта (Лариса)\n\nсумма бюджетов 8 500,00 ₽ при недельном откруте 6 100,00 ₽\n\n(2 запущенные кампании)\n\nНедельный открут - 8 500,00 ₽ (запланировано: 6 100,00 ₽)\nМесячный открут - 34 000,00 ₽ (запланировано: 24 400,00 ₽)", "СушиСЕЛЛ г. Курган - специалист проекта (Лариса)\n\nсумма бюджетов 16 150,00 ₽ при недельном откруте 12 500,00 ₽\n\n(4 запущенные кампании)\n\nНедельный открут - 16 150,00 ₽ (запланировано: 12 500,00 ₽)\nМесячный открут - 64 600,00 ₽ (запланировано: 50 000,00 ₽)", "СушиСЕЛЛ г. Сосновоборск - специалист проекта (Ксюша)\n\nсумма бюджетов 10 000,00 ₽ при недельном откруте 9 250,00 ₽\n\n(1 запущенная кампания)\n\nНедельный открут - 10 000,00 ₽ (запланировано: 9 250,00 ₽)\nМесячный открут - 40 000,00 ₽ (запланировано: 37 000,00 ₽)", "СушиСЕЛЛ г. Улан-Удэ - специалист проекта (Лариса)\n\nсумма бюджетов 8 650,00 ₽ при недельном откруте 7 500,00 ₽\n\n(3 запущенные кампании)\n\nНедельный открут - 8 650,00 ₽ (запланировано: 7 500,00 ₽)\nМесячный открут - 34 600,00 ₽ (запланировано: 30 000,00 ₽)"]''')
            settings = load_settings()
            db = SessionLocal()
            try:
                for message in messages:
                    print(deliver_report_message(db, settings, message))
            finally:
                db.close()
            PY
