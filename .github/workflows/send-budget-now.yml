name: Send budget warning now

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send via the same channel as the daily summary
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            docker exec -i direct-analytics-bot python - <<'PY'
            import textwrap

            from src.config import load_settings
            from src.db.database import SessionLocal
            from src.services.message_delivery import deliver_report_message

            text = textwrap.dedent("""\
            Операторам

            Бюджеты запущенных кампаний больше недельного открута

            Лариса · Гринпарк г. Феодосия
            сумма бюджетов 15 050,00 ₽ при недельном откруте 13 750,00 ₽ (4 запущенных)

            Ксюша · СушиСЕЛЛ г. Гатчина
            сумма бюджетов 12 000,00 ₽ при недельном откруте 5 000,00 ₽ (1 запущенных)

            Ксюша · СушиСЕЛЛ г. Ефремов
            сумма бюджетов 27 700,00 ₽ при недельном откруте 6 250,00 ₽ (4 запущенных)

            Ксюша · СушиСЕЛЛ г. Ишим
            сумма бюджетов 61 500,00 ₽ при недельном откруте 9 150,00 ₽ (5 запущенных)

            Ксюша · СушиСЕЛЛ г. Кингисепп
            сумма бюджетов 22 000,00 ₽ при недельном откруте 9 150,00 ₽ (2 запущенных)

            Лариса · СушиСЕЛЛ г. Киселёвск
            сумма бюджетов 8 500,00 ₽ при недельном откруте 6 100,00 ₽ (2 запущенных)

            Лариса · СушиСЕЛЛ г. Курган
            сумма бюджетов 16 150,00 ₽ при недельном откруте 12 500,00 ₽ (4 запущенных)

            Ксюша · СушиСЕЛЛ г. Сосновоборск
            сумма бюджетов 10 000,00 ₽ при недельном откруте 9 250,00 ₽ (1 запущенных)

            Лариса · СушиСЕЛЛ г. Улан-Удэ
            сумма бюджетов 8 650,00 ₽ при недельном откруте 7 500,00 ₽ (3 запущенных)
            """).strip()

            settings = load_settings()
            db = SessionLocal()
            try:
                where = deliver_report_message(db, settings, text)
            finally:
                db.close()
            print(where)
            PY
